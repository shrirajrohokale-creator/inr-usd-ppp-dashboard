name: Refresh data

on:
  schedule:
    - cron: "17 11 * * *"   # daily, 11:17 UTC
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install fetch dependencies
        run: pip install "pandas>=2.2" "requests>=2.32"

      - name: Fetch data
        id: fetch
        run: python fetch_data.py
        continue-on-error: true   # still commit the log so a failure is visible

      - name: Commit updated data and log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      - name: Fail the run if any series failed
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "At least one series failed to refresh; see the run summary and data/refresh_log.json"
          exit 1
